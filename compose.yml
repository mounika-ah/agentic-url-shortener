services:
  postgres:
    image: postgres:17-alpine
    container_name: shortforge-postgres
    environment:
      POSTGRES_DB: shortforge
      POSTGRES_USER: shortforge
      POSTGRES_PASSWORD: shortforge
    ports:
      - "5432:5432"
    volumes:
      - shortforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortforge -d shortforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: shortforge-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - shortforge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    container_name: shortforge-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:29092,external://localhost:9092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - shortforge-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk cluster health --brokers=localhost:9092 | grep -q 'Healthy:.*true'"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  shortforge-postgres-data:
  shortforge-redis-data:
  shortforge-redpanda-data: