name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: shortforge
          POSTGRES_USER: shortforge
          POSTGRES_PASSWORD: shortforge

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U shortforge -d shortforge"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shortforge
      SPRING_DATASOURCE_USERNAME: shortforge
      SPRING_DATASOURCE_PASSWORD: shortforge

      SPRING_DATA_REDIS_HOST: localhost
      SPRING_DATA_REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Run tests and build
        run: ./mvnw --batch-mode clean verify