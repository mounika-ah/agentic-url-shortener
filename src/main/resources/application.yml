spring:
  application:
    name: agentic-url-shortener

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shortforge}
    username: ${SPRING_DATASOURCE_USERNAME:shortforge}
    password: ${SPRING_DATASOURCE_PASSWORD:shortforge}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

      properties:
        "[spring.json.add.type.headers]": false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

  cache:
    url-ttl: ${URL_CACHE_TTL:30m}

  idempotency:
    result-ttl: ${IDEMPOTENCY_RESULT_TTL:24h}
    lock-ttl: ${IDEMPOTENCY_LOCK_TTL:60s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  api-docs:
    path: /v3/api-docs