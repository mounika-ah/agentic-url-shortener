spring:
  application:
    name: agentic-url-shortener

  app:
    base-url: ${APP_BASE_URL:http://localhost:8080}
    cache:
      url-ttl: ${URL_CACHE_TTL:30m}
    idempotency:
      result-ttl: ${IDEMPOTENCY_RESULT_TTL:24h}
      lock-ttl: ${IDEMPOTENCY_LOCK_TTL:60s}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortforge}
    username: ${DB_USERNAME:shortforge}
    password: ${DB_PASSWORD:shortforge}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always