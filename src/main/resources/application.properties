spring:
application:
name: agentic-url-shortener

datasource:
url: ${DB_URL:jdbc:postgresql://localhost:5432/shortforge}
username: ${DB_USERNAME:shortforge}
password: ${DB_PASSWORD:shortforge}
driver-class-name: org.postgresql.Driver

jpa:
open-in-view: false
hibernate:
ddl-auto: validate
properties:
hibernate:
format_sql: true

flyway:
enabled: true
locations: classpath:db/migration

management:
endpoints:
web:
exposure:
include: health,info,metrics,prometheus

endpoint:
health:
show-details: always