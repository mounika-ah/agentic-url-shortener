spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        "[request.timeout.ms]": 10000
        "[delivery.timeout.ms]": 30000
        "[max.block.ms]": 10000

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN